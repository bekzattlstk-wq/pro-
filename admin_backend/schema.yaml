          description: ''
components:
  schemas:
    AdminOrder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          readOnly: true
          nullable: true
        shop_name:
          type: string
          maxLength: 200
        service_name:
          type: string
          maxLength: 200
        customer_name:
          type: string
          maxLength: 200
        customer_phone:
          type: string
          maxLength: 30
        city:
          type: string
          maxLength: 100
        street:
          type: string
          maxLength: 150
        house:
          type: string
          maxLength: 50
        customer_comment:
          type: string
        admin_comment:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/StatusEnum'
        status_label:
          type: string
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        manager:
          type: integer
          nullable: true
        installer:
          type: integer
          nullable: true
        work_at:
          type: string
          format: date-time
          nullable: true
        is_urgent:
          type: boolean
        files:
          type: array
          items:
            $ref: '#/components/schemas/OrderFile'
          readOnly: true
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
          readOnly: true
        is_deleted:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - comments
      - created_at
      - created_by
      - customer_name
      - customer_phone
      - files
      - id
      - is_deleted
      - number
      - service_name
      - shop_name
      - status_label
      - updated_at
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        author:
          type: integer
          readOnly: true
        author_name:
          type: string
          readOnly: true
        text:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - author_name
      - created_at
      - id
      - text
    Employee:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - full_name
      - id
      - username
    Manager:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - id
      - username
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        order:
          type: integer
          readOnly: true
        message:
          type: string
          readOnly: true
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - message
      - order
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          readOnly: true
          nullable: true
        shop_name:
          type: string
          maxLength: 200
        service_name:
          type: string
          maxLength: 200
        customer_name:
          type: string
          maxLength: 200
        customer_phone:
          type: string
          maxLength: 30
        city:
          type: string
          maxLength: 100
        street:
          type: string
          maxLength: 150
        house:
          type: string
          maxLength: 50
        customer_comment:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        status_label:
          type: string
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        manager:
          type: integer
          readOnly: true
          nullable: true
        installer:
          type: integer
          readOnly: true
          nullable: true
        work_at:
          type: string
          format: date-time
          nullable: true
        is_urgent:
          type: boolean
          readOnly: true
        files:
          type: array
          items:
            $ref: '#/components/schemas/OrderFile'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - customer_name
      - customer_phone
      - files
      - id
      - installer
