{% if messages %}
    <div class="space-y-2 mb-4">
        {% for message in messages %}
            <div class="px-4 py-2.5 rounded-xl text-xs font-semibold
                        {% if message.tags == 'error' %}bg-red-50 text-red-600 border border-red-200
                        {% elif message.tags == 'success' %}bg-emerald-50 text-emerald-700 border border-emerald-200
                        {% else %}bg-gray-50 text-gray-600 border border-gray-200{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    </div>
{% endif %}
