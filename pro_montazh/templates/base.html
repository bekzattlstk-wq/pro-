{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PRO Монтаж — сервис по монтажу дверей{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS собран локально (static/css/tailwind.css) — интернет для стилей не нужен.
         Пересобрать после добавления новых классов:
         npx tailwindcss -c tailwind.config.js -i tailwind-input.css -o static/css/tailwind.css --minify -->
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">

    <style>
        body { font-family: 'Montserrat', 'Inter', sans-serif; color: #1A1A1A; }

        /* Карточка-поле, как в макете: серый фон, мини-подпись сверху */
        .field-card {
            background-color: #F7F8FA;
            border-radius: 12px;
            padding: 9px 14px 8px;
            border: 1px solid transparent;
            transition: all .18s ease;
        }
        .field-card:focus-within {
            background-color: #fff;
            border-color: #E9EBEF;
            box-shadow: 0 6px 18px rgba(0,0,0,.06);
        }
        .field-card label, .field-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #6B7280;
            margin-bottom: 1px;
        }
        .field-card input,
        .field-card select,
        .field-card textarea {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-size: 13px;
            font-weight: 500;
            color: #111;
            resize: none;
        }
        .field-card input:disabled,
        .field-card select:disabled,
        .field-card textarea:disabled { color: #6B7280; cursor: default; }
        .field-card input::placeholder, .field-card textarea::placeholder { color: #B6BCC6; font-weight: 400; }

        /* Поля авторизации с нижней чертой */
        .auth-field input { border-bottom: 1px solid #E5E7EB; padding-bottom: 3px; }
        .auth-field input:focus { border-bottom-color: #D80000; }

        .btn-brand { background-color: #D80000; color: #fff; transition: all .18s ease; }
        .btn-brand:hover { background-color: #B00000; box-shadow: 0 6px 16px rgba(216,0,0,.25); }
        .btn-outline { border: 1px solid #D80000; color: #D80000; transition: all .18s ease; }
        .btn-outline:hover { background-color: #D80000; color: #fff; }

        .card { background: #fff; border: 1px solid #EDEFF3; border-radius: 16px; }

        /* Зона перетаскивания файлов */
        .dropzone {
            border: 1px dashed #D7DBE2;
            border-radius: 14px;
            transition: all .18s ease;
            cursor: pointer;
        }
        .dropzone:hover, .dropzone.is-dragover { border-color: #D80000; background: #FFF6F6; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #DDE1E7; border-radius: 8px; }
    </style>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-white antialiased">
{% block body %}{% endblock %}
<script src="{% static 'js/main.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
